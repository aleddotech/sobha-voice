# Render Blueprint — https://dashboard.render.com/select-repo?type=blueprint
# Create this from the GitHub repo. Fill env values in the Render dashboard
# (do not commit secrets). After the web service is live, set its public URL
# as the Vercel /api rewrite destination if you host the playground on Vercel.

services:
  - type: web
    name: sobha-voice-web
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: sobha-calls
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: SPAWN_AGENT
        value: "0"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: CALLS_DB_PATH
        value: /var/data/calls.db
      - key: CALLS_AUDIO_DIR
        value: /var/data/recordings
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: ELEVEN_API_KEY
        sync: false
      - key: ELEVEN_VOICE_ID
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://sobha-voice-web.onrender.com

  - type: worker
    name: sobha-voice-agent
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python src/agent.py start
    # bounce 2026-09-21: worker had unregistered; keep a LiveKit registration 24/7
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: CALLS_API_URL
        value: https://sobha-voice-web.onrender.com
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: ELEVEN_API_KEY
        sync: false
      - key: ELEVEN_VOICE_ID
        sync: false
